name: Bug report
description: Report reproducible YRadar behavior with redacted evidence
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not post tokens, cookies, chat IDs, addresses, full VINs, or order details."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      options: [Model Y, Model 3, Both, Unknown]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, cookies, locations, order data, and full VINs.
          required: true
