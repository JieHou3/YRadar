name: Feature request
description: Propose an evidence-backed improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Shopping or monitoring problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and model-specific limits
      description: Explain source, confidence, and unknown cases. Redact personal data and VINs.
    validations:
      required: true
