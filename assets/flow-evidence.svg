<svg xmlns="http://www.w3.org/2000/svg" width="960" height="399" viewBox="0 0 960 399" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">How configuration is labeled</title>
  <desc id="description">Evaluate the available evidence for each vehicle feature.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0a1426"/><stop offset="1" stop-color="#172541"/></linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L6 3.5 0 7Z" fill="#516d90"/></marker>
  </defs>
  <rect width="960" height="399" rx="21" fill="url(#surface)"/>
  <g font-family="Inter, Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <text x="30" y="51" fill="#f2f6ff" font-size="34" font-weight="700">How configuration is labeled</text>
  <text x="30" y="81" fill="#aebfda" font-size="19">Evaluate the available evidence for each vehicle feature.</text>
  <path d="M30 100H930" stroke="#2e4265"/>
  <rect x="30" y="119" width="260" height="154" rx="17" fill="#15233c" stroke="#344a6e"/>
  <rect x="46" y="134" width="38" height="38" rx="10" fill="#3ee6c4" fill-opacity=".1"/>
  <g transform="translate(53 141)" fill="none" stroke="#3ee6c4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 9h8M8 13h5"/></g>
  <text x="46" y="201" fill="#f2f6ff" font-size="24" font-weight="700">Tesla listing</text>
  <text x="46" y="228" fill="#aebfda" font-size="19">Read explicit listing</text>
  <text x="46" y="251" fill="#aebfda" font-size="19">or option data.</text>
  <rect x="350" y="119" width="260" height="154" rx="17" fill="#15233c" stroke="#344a6e"/>
  <rect x="366" y="134" width="38" height="38" rx="10" fill="#9cbcff" fill-opacity=".1"/>
  <g transform="translate(373 141)" fill="none" stroke="#9cbcff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-2-13-4 14"/></g>
  <text x="366" y="201" fill="#f2f6ff" font-size="24" font-weight="700">Model-specific VIN</text>
  <text x="366" y="228" fill="#aebfda" font-size="19">Use a rule that applies</text>
  <text x="366" y="251" fill="#aebfda" font-size="19">to this model and year.</text>
  <rect x="670" y="119" width="260" height="154" rx="17" fill="#15233c" stroke="#344a6e"/>
  <rect x="686" y="134" width="38" height="38" rx="10" fill="#ffc987" fill-opacity=".1"/>
  <g transform="translate(693 141)" fill="none" stroke="#ffc987" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M10 9a2.2 2.2 0 0 1 4 1c0 2-2 1.4-2 4m0 2.5h.01"/></g>
  <text x="686" y="201" fill="#f2f6ff" font-size="24" font-weight="700">Insufficient data</text>
  <text x="686" y="228" fill="#aebfda" font-size="19">Leave the value open</text>
  <text x="686" y="251" fill="#aebfda" font-size="19">for manual verification.</text>
  <path d="M299 186H341" stroke="#516d90" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="175" fill="#aebfda" font-size="15" font-weight="700" text-anchor="middle">None</text>
  <path d="M619 186H661" stroke="#516d90" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="175" fill="#aebfda" font-size="15" font-weight="700" text-anchor="middle">No rule</text>
  <path d="M160 274v14" stroke="#516d90" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="292" width="260" height="61" rx="12" fill="#111f34" stroke="#3c5274"/>
  <text x="160" y="317" fill="#3ee6c4" font-size="21" font-weight="700" text-anchor="middle">Confirmed</text>
  <text x="160" y="339" fill="#aebfda" font-size="18" text-anchor="middle">Direct listing evidence</text>
  <path d="M480 274v14" stroke="#516d90" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="292" width="260" height="61" rx="12" fill="#111f34" stroke="#3c5274"/>
  <text x="480" y="317" fill="#9cbcff" font-size="21" font-weight="700" text-anchor="middle">Likely</text>
  <text x="480" y="339" fill="#aebfda" font-size="18" text-anchor="middle">VIN rule with a reason</text>
  <path d="M800 274v14" stroke="#516d90" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="670" y="292" width="260" height="61" rx="12" fill="#111f34" stroke="#3c5274"/>
  <text x="800" y="317" fill="#ffc987" font-size="21" font-weight="700" text-anchor="middle">Unknown</text>
  <text x="800" y="339" fill="#aebfda" font-size="18" text-anchor="middle">No reliable conclusion</text>
  <text x="30" y="379" fill="#aebfda" font-size="18">Conflicting listing evidence also stays unknown.</text>
  </g>
</svg>
