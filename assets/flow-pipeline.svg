<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Inventory to notification</title>
  <desc id="description">A dedicated browser collects inventory. SQLite keeps changes and pending alerts.</desc>
